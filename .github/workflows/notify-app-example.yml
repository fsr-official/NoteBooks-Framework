# Example GitHub Actions workflow to notify app of updates
#
# To use this:
# 1. Rename this file to notify-app.yml (remove -example)
# 2. Add APP_WEBHOOK_URL secret to your repository (Settings → Secrets and Variables → Actions)
# 3. Customize the 'on' trigger as needed for your repo
#
# For more info, see docs/WEBHOOK_SETUP.md

name: Notify App of Updates

on:
  # Option 1: Run after your main build/deploy workflow completes
  # Uncomment and adjust the workflow name to match your deployment workflow
  # workflow_run:
  #   workflows: ["Build and Deploy"]
  #   types: [completed]
  #   branches: [main]

  # Automatic push notifications remain disabled until APP_WEBHOOK_URL is configured.
  # Option 2 can be restored after the endpoint and server-side secret are verified.

  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      signal_type:
        description: "Type of update"
        required: true
        default: "directory"
        type: choice
        options:
          - directory
          - file
      signal_path:
        description: "Path to updated file/directory"
        required: false
        type: string

jobs:
  notify-app:
    runs-on: ubuntu-latest
    env:
      APP_WEBHOOK_URL: ${{ secrets.APP_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get commit hash
        id: commit
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Commit hash: $HASH"

      - name: Get branch name
        id: branch
        run: |
          BRANCH=$(echo ${GITHUB_REF#refs/heads/})
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH"

      - name: Determine signal type
        id: signal
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ github.event.inputs.signal_type }}"
          else
            TYPE="directory"
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Signal type: $TYPE"

      - name: Build payload
        id: payload
        run: |
          SIGNAL_REASON="Push to ${{ steps.branch.outputs.branch }} branch"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SIGNAL_REASON="Manual trigger"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            SIGNAL_REASON="Workflow completed"
          fi

          echo "reason=$SIGNAL_REASON" >> $GITHUB_OUTPUT
          echo "Reason: $SIGNAL_REASON"

      - name: Notify app - Directory update (full refresh)
        if: steps.signal.outputs.type == 'directory'
        run: |
          if [ -z "$APP_WEBHOOK_URL" ]; then
            echo "APP_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi
          echo "Sending directory update signal to app..."
          curl --fail-with-body --retry 3 --max-time 15 -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            --data @- \
            "$APP_WEBHOOK_URL" \
          << EOF
          {
            "signal": "github-${{ github.run_id }}",
            "type": "directory",
            "path": ".",
            "reason": "${{ steps.payload.outputs.reason }}",
            "commitHash": "${{ steps.commit.outputs.hash }}",
            "branch": "${{ steps.branch.outputs.branch }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          if [ $? -eq 0 ]; then
            echo "✓ Successfully notified app of directory update"
          else
            echo "✗ Failed to notify app"
            exit 1
          fi

      - name: Notify app - File update
        if: steps.signal.outputs.type == 'file'
        run: |
          if [ -z "$APP_WEBHOOK_URL" ]; then
            echo "APP_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi
          FILE_PATH="${{ github.event.inputs.signal_path }}"
          if [ -z "$FILE_PATH" ]; then
            FILE_PATH="(file updated)"
          fi

          echo "Sending file update signal to app..."
          curl --fail-with-body --retry 3 --max-time 15 -X POST \
            -H "Content-Type: application/json" \
            --data @- \
            "$APP_WEBHOOK_URL" \
          << EOF
          {
            "signal": "github-${{ github.run_id }}",
            "type": "file",
            "path": "$FILE_PATH",
            "reason": "${{ steps.payload.outputs.reason }}",
            "commitHash": "${{ steps.commit.outputs.hash }}"
          }
          EOF

          if [ $? -eq 0 ]; then
            echo "✓ Successfully notified app of file update"
          else
            echo "✗ Failed to notify app"
            exit 1
          fi

      - name: Status check
        run: |
          echo ""
          echo "=== Notification Summary ==="
          echo "Signal: ${{ steps.signal.outputs.type }}"
          echo "Commit: ${{ steps.commit.outputs.hash }}"
          echo "Branch: ${{ steps.branch.outputs.branch }}"
          echo "Reason: ${{ steps.payload.outputs.reason }}"
