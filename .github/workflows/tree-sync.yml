name: Generate files manifest and request tree rebuild

on:
  workflow_call:
    inputs:
      stream:
        description: 'NoteBooks stream to rebuild'
        required: true
        type: string
    secrets:
      NOTEBOOKS_UPDATE_URL:
        description: 'NoteBooks /api/webhooks/content-update endpoint'
        required: true
      NOTEBOOKS_UPDATE_SECRET:
        description: 'HMAC secret shared with the NoteBooks app'
        required: true
permissions:
  contents: write

concurrency:
  group: notebooks-tree-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  tree-sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      UPDATE_URL: ${{ secrets.NOTEBOOKS_UPDATE_URL }}
      UPDATE_SECRET: ${{ secrets.NOTEBOOKS_UPDATE_SECRET }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate files.json
        run: |
          set -euo pipefail
          test -f fmtree.py
          python3 fmtree.py --out files.json
          test -s files.json
          python3 - <<'PY'
          import json
          import re
          with open('files.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          if not isinstance(manifest, dict):
              raise SystemExit('files.json must contain a JSON object')

          def verify(node):
              if not isinstance(node, dict):
                  return
              if node.get('type') == 'file' and not re.fullmatch(r'[a-fA-F0-9]{40}', str(node.get('sha', ''))):
                  raise SystemExit(f"file entry lacks a Git blob SHA: {node.get('path') or node.get('name')}")
              for child in node.get('children', []):
                  verify(child)

          verify(manifest)
          print('files.json and file blob SHAs are valid')
          PY

      - name: Commit files.json without retriggering this workflow
        id: manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add files.json
          if git diff --cached --quiet -- files.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'files.json is already current.'
          else
            git commit -m 'chore: refresh files.json [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'files.json was committed. The workflow ignores files.json-only pushes.'
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy static site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify NoteBooks of content update
        run: |
          set -euo pipefail
          test -n "$UPDATE_URL"
          test -n "$UPDATE_SECRET"
          jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commitSha "${{ steps.manifest.outputs.commit }}" \
            '{schemaVersion:1,kind:"content",repository:$repository,branch:$branch,commitSha:$commitSha}' > payload.json
          signature="sha256=$(openssl dgst -sha256 -hmac "$UPDATE_SECRET" -hex payload.json | awk '{print $NF}')"
          curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: GitHub-Actions-NoteBooks-Content-Update' \
            -H "X-NoteBooks-Signature: $signature" \
            --data-binary @payload.json \
            "$UPDATE_URL"

      - name: Explain artifact policy
        run: |
          echo 'files.json is committed for raw-source consumption by the Framework build.'
          echo 'The update notification is processed at runtime and does not trigger a Framework deployment.'
