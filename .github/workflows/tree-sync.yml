name: Generate files manifest and request tree rebuild

on:
  workflow_call:
    inputs:
      stream:
        description: 'NoteBooks stream to rebuild'
        required: true
        type: string
    secrets:
      TREE_REBUILD_URL:
        description: 'Framework tree rebuild API URL'
        required: true
      TREE_REBUILD_SECRET:
        description: 'HMAC secret shared with the Framework API'
        required: true
permissions:
  contents: write

concurrency:
  group: notebooks-tree-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  tree-sync:
    runs-on: ubuntu-latest
    env:
      REBUILD_URL: ${{ secrets.TREE_REBUILD_URL }}
      REBUILD_SECRET: ${{ secrets.TREE_REBUILD_SECRET }}
      REBUILD_STREAM: ${{ inputs.stream }}
      REBUILD_ORIGIN: ${{ github.repository }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate files.json
        run: |
          set -euo pipefail
          test -f fmtree.py
          python3 fmtree.py --out files.json
          test -s files.json
          python3 - <<'PY'
          import json
          with open('files.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          if not isinstance(manifest, dict):
              raise SystemExit('files.json must contain a JSON object')
          print('files.json is valid JSON')
          PY

      - name: Commit files.json without retriggering this workflow
        id: manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add files.json
          if git diff --cached --quiet -- files.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'files.json is already current.'
          else
            git commit -m 'chore: refresh files.json [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'files.json was committed. The workflow ignores files.json-only pushes.'
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy static site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Request Framework static rebuild
        run: |
          set -euo pipefail
          test -n "$REBUILD_STREAM"
          test -n "$REBUILD_URL"
          test -n "$REBUILD_SECRET"
          jq -cn \
            --arg stream "$REBUILD_STREAM" \
            --arg origin "$REBUILD_ORIGIN" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "${{ steps.manifest.outputs.commit }}" \
            --arg reason "files.json generated by ${GITHUB_WORKFLOW}" \
            '{streams:[$stream], origin:$origin, repository:$repository, commit:$commit, reason:$reason}' > payload.json
          signature="sha256=$(openssl dgst -sha256 -hmac "$REBUILD_SECRET" -hex payload.json | sed 's/^.* //')"
          curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: GitHub-Actions-NoteBooks-Tree-Sync' \
            -H "X-Notebooks-Workflow-Origin: $REBUILD_ORIGIN" \
            -H "X-Notebooks-Signature: $signature" \
            --data-binary @payload.json \
            "$REBUILD_URL"

      - name: Explain artifact policy
        run: |
          echo 'files.json is committed for raw-source consumption by the Framework build.'
          echo 'The files.json-only push is excluded by each source repository caller workflow.'
          echo 'The Framework rebuild API triggers the deployment that bundles the new static tree.'
