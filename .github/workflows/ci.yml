name: CI

on:
  push:
    branches: [main, whoami]
  pull_request:
    branches: [main, whoami]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Run production build
        run: npm run build
      - name: Run browser movement smoke test
        run: |
          PORT=4173 npm run start > /tmp/notebooks-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/settings >/dev/null && break
            sleep 1
          done
          npm run test:browser
      - name: Verify release compatibility
        run: npm run verify:release
