name: Repository reconciliation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      REPOSITORY_RECONCILIATION_SECRET: ${{ secrets.REPOSITORY_RECONCILIATION_SECRET }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Enqueue scheduled repository checks
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$REPOSITORY_RECONCILIATION_SECRET" ]; then
            echo "::error::Set APP_BASE_URL and REPOSITORY_RECONCILIATION_SECRET in repository Actions secrets."
            exit 1
          fi

          base_url="${APP_BASE_URL%/}"
          request_body="$(node -e 'process.stdout.write(JSON.stringify({runId: process.env.WORKFLOW_RUN_ID, runAttempt: Number(process.env.WORKFLOW_RUN_ATTEMPT)}))')"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $REPOSITORY_RECONCILIATION_SECRET" \
            --data-binary "$request_body" \
            "$base_url/api/cron/repository-reconciliation"
