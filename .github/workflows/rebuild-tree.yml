name: Rebuild NoteBooks stream tree

on:
  workflow_call:
    inputs:
      stream:
        description: 'NoteBooks stream to rebuild'
        required: true
        type: string
      origin:
        description: 'Exact repository origin registered in TREE_REBUILD_ALLOWED_ORIGINS'
        required: true
        type: string
    secrets:
      TREE_REBUILD_URL:
        required: true
      TREE_REBUILD_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      stream:
        description: 'NoteBooks stream to rebuild'
        required: true
        type: choice
        options:
          - science
          - commerce
          - humanities
      origin:
        description: 'Exact workflow origin'
        required: true
        type: string

jobs:
  rebuild-tree:
    runs-on: ubuntu-latest
    env:
      REBUILD_URL: ${{ secrets.TREE_REBUILD_URL }}
      REBUILD_SECRET: ${{ secrets.TREE_REBUILD_SECRET }}
      REBUILD_STREAM: ${{ inputs.stream || github.event.inputs.stream }}
      REBUILD_ORIGIN: ${{ inputs.origin || github.event.inputs.origin }}
    steps:
      - name: Build signed rebuild payload
        run: |
          set -euo pipefail
          jq -cn \
            --arg stream "$REBUILD_STREAM" \
            --arg origin "$REBUILD_ORIGIN" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg reason "GitHub workflow ${GITHUB_WORKFLOW} completed" \
            '{streams:[$stream], origin:$origin, repository:$repository, commit:$commit, reason:$reason}' > payload.json
          echo "payload=$(cat payload.json)"
      - name: Rebuild stream tree
        run: |
          set -euo pipefail
          test -n "$REBUILD_URL"
          test -n "$REBUILD_SECRET"
          signature="sha256=$(openssl dgst -sha256 -hmac "$REBUILD_SECRET" -hex payload.json | sed 's/^.* //')"
          curl --fail-with-body --retry 3 --max-time 30 -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: GitHub-Actions-NoteBooks-Tree-Rebuild' \
            -H "X-Notebooks-Workflow-Origin: $REBUILD_ORIGIN" \
            -H "X-Notebooks-Signature: $signature" \
            --data-binary @payload.json \
            "$REBUILD_URL"
