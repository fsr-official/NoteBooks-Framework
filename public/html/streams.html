<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#030811" />
  <title>NoteBooks Workspace</title>
  <link rel="stylesheet" href="/public/css/theme.css" />
  <link rel="stylesheet" href="/public/css/style.css" />
  <link rel="stylesheet" href="/public/css/streams.css" />
  <link rel="stylesheet" href="/public/css/tree.css" />
</head>
<body class="stream-shell-page">
  <nav class="global-nav" aria-label="Primary navigation">
    <a class="global-nav-brand" href="/" aria-label="NoteBooks home"><span class="global-nav-mark">N</span><span class="global-nav-word">NoteBooks</span></a>
    <div class="global-nav-links">
      <a href="/" data-nav="home">Home</a><a href="/science" data-nav="science">Science</a><a href="/commerce" data-nav="commerce">Commerce</a><a href="/humanities" data-nav="humanities">Humanities</a><a href="/community" data-nav="community">Community</a><a href="/issues" data-nav="issues">Issues</a><a href="/volunteers" data-nav="volunteers">Volunteers</a><a href="/accounts" data-nav="accounts">Account</a><a href="/settings" data-nav="settings">Settings</a><a href="/about" data-nav="about">About</a>
    </div>
    <button class="global-nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
  </nav>

  <main class="stream-workspace-main">
    <section class="app-shell" aria-label="NoteBooks file workspace">
      <main class="window workspace-window" id="workspaceWindow" aria-label="File workspace">
        <div class="toolbar">
          <h1 id="workspaceHeader">NoteBooks</h1>
          <div class="workspace-location-marker" id="workspaceLocationMarker" role="status" aria-live="polite">Inside: workspace root</div>
          <button class="mob-toolbar-overflow" onclick="refreshFiles()" title="Refresh">↻</button>
          <button class="mob-toolbar-overflow" onclick="goUp()" title="Go up">↑</button>
          <button class="mob-toolbar-overflow" onclick="showUploadScreen()" title="Upload">⬆</button>
          <button class="editor-launch-button" onclick="openNewMarkdownEditor()" title="New Markdown note">✎ New note</button>
          <button class="mob-toolbar-overflow" onclick="openCommunity()" title="Community">•••</button>
          <button id="loginBtnToolbar" onclick="showLoginScreen()" title="Login / Account">Account</button>
        </div>
        <div class="path-nav" id="pathNav" aria-label="Current location"><span class="path-segment" onclick="goToRoot()">☁️</span></div>
        <div class="list-view" id="listView" aria-live="polite"></div>
      </main>

      <aside class="tree-rail" id="treeRail" aria-label="Repository navigator">
        <div class="tree-rail-header">
          <div><div class="tree-rail-kicker">NAVIGATOR</div><div class="tree-rail-title">Repository tree</div></div>
          <button class="sidebar-collapse-control" id="sidebarCollapseBtn" type="button" aria-label="Collapse navigator" aria-expanded="true">›</button>
        </div>
        <div class="sidebar-section sidebar-browse-section">
          <label class="sidebar-section-title" for="sidebarSearch">Search files and folders</label>
          <input class="sidebar-search-input" id="sidebarSearch" type="search" placeholder="Filter tree" autocomplete="off" aria-label="Search repository files and folders" />
          <div class="tree-current-location" id="treeCurrentLocation" role="status" aria-live="polite">Current location: workspace root</div>
          <div class="sidebar-tree" id="sidebarTree" role="tree" aria-label="Repository files and folders"><div class="sidebar-tree-empty">Loading file tree…</div></div>
          <div class="tree-hover-details" id="treeHoverDetails" role="tooltip" aria-live="polite" hidden></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="context-menu" id="contextMenu">
    <button onclick="handlePreview()"><span class="icon">👁️</span>Preview</button>
    <button onclick="handleDownload()"><span class="icon">📥</span>Download</button>
  </div>
  <div class="preview-container" id="previewContainer"></div>
  <div id="taskbar" style="display: none;"></div>
  <div class="mobile-preview" id="mobilePreview">
    <div class="content">
      <div class="header">
        <div class="title" id="mobilePreviewTitle">Preview</div>
        <div class="close" onclick="closeMobilePreview()">×</div>
      </div>
      <div class="body" id="mobilePreviewContent"></div>
    </div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>

    <script src="/public/js/config.js"></script>
  <script src="/public/js/modern-auth.js" defer></script>
  <!-- Keep the stream shell preview stack aligned with the main app shell. -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-sub@1/dist/markdown-it-sub.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-sup@1/dist/markdown-it-sup.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3/dist/markdown-it-footnote.min.js" defer></script>
  <script src="/public/js/obsidian-markdown-it.js" defer></script>
  <script src="/public/js/md-init.js" defer></script>
  <script src="/public/js/markdown-editor.js" defer></script>
  <script src="/public/js/markdown.js" defer></script>
  <script src="/public/client/streams.js" defer></script>
  <script>

    // Determine current stream from path or query and expose it for app.js
    (function(){
      try {
        const url = new URL(window.location.href);
        let stream = url.searchParams.get('stream');
        if (!stream) {
          const segs = url.pathname.split('/').filter(Boolean);
          if (segs.length) stream = segs[0];
        }
        if (!stream) stream = 'science';
        window.CURRENT_STREAM = stream.toLowerCase();
        document.documentElement.classList.add(`stream-${window.CURRENT_STREAM}`);
      } catch(e) { window.CURRENT_STREAM = 'science'; }
    })();
  </script>
    <script src="/public/js/theme.js"></script>
    <script src="/public/js/reading-preferences.js"></script>
    <script src="/public/js/stream-runtime.js"></script>
    <script src="/public/js/raw-delivery.js"></script>
    <script src="/public/js/app.js" defer></script>
  <script src="/public/js/auth.js" defer></script>
  <!-- community.js archived → archive/removed-public-js/community.js (forum feature) -->
</body>
</html>
