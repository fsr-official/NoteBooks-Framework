<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Console</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 4rem; }
      h1 { margin-bottom: 1.5rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
      .card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px; padding: 1rem; }
      form { display: grid; gap: 0.75rem; }
      label { display: grid; gap: 0.35rem; font-size: 0.9rem; color: #cbd5e1; }
      input, select, button { font: inherit; }
      input, select { padding: 0.7rem 0.8rem; border-radius: 8px; border: 1px solid rgba(148, 163, 184, 0.4); background: rgba(15, 23, 42, 0.9); color: #f8fafc; }
      button { cursor: pointer; border: 0; background: #2563eb; color: white; border-radius: 8px; padding: 0.7rem 1rem; font-weight: 600; }
      button.secondary { background: #334155; }
      ul { margin: 0; padding-left: 1.1rem; }
      li { margin-bottom: 0.5rem; }
      .status { margin-top: 0.75rem; min-height: 1.25rem; color: #93c5fd; }
      .muted { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Admin Console</h1>
      <div class="grid">
        <section class="card">
          <h2>Role Management</h2>
          <form id="assign-role-form">
            <label>Email<input name="email" type="email" required /></label>
            <label>Role<select name="role"><option value="admin">admin</option><option value="moderator">moderator</option><option value="user">user</option></select></label>
            <button type="submit">Assign role</button>
          </form>
          <div class="status" id="assign-role-status"></div>
          <form id="revoke-role-form" style="margin-top:1rem;">
            <label>Email<input name="email" type="email" required /></label>
            <button class="secondary" type="submit">Revoke role</button>
          </form>
          <div class="status" id="revoke-role-status"></div>
        </section>
        <section class="card">
          <h2>Ban / Unban</h2>
          <form id="ban-form">
            <label>Email<input name="email" type="email" required /></label>
            <label>Until<input name="until" type="datetime-local" /></label>
            <button type="submit">Ban user</button>
          </form>
          <div class="status" id="ban-status"></div>
          <form id="unban-form" style="margin-top:1rem;">
            <label>Email<input name="email" type="email" required /></label>
            <button class="secondary" type="submit">Unban user</button>
          </form>
          <div class="status" id="unban-status"></div>
        </section>
        <section class="card">
          <h2>Recent Audit Log</h2>
          <ul id="logs-list"></ul>
        </section>
        <section class="card">
          <h2>Open PRs</h2>
          <ul id="prs-list"></ul>
        </section>
      </div>
    </div>
    <script>
      function getCsrfHeaders() {
        const cookieMatch = document.cookie.split(';').map((c) => c.trim()).find((c) => c.startsWith('csrf='));
        const csrf = cookieMatch ? cookieMatch.split('=')[1] : null;
        const headers = { 'Content-Type': 'application/json' };
        if (csrf) {
          headers['x-csrf-token'] = csrf;
          headers['x-csrf-cookie'] = csrf;
        }
        return headers;
      }

      async function callAdmin(action, payload, statusEl) {
        statusEl.textContent = 'Working...';
        try {
          const res = await fetch(`/api/admin?action=${action}`, {
            method: 'POST',
            credentials: 'same-origin',
            headers: getCsrfHeaders(),
            body: JSON.stringify(payload)
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(json.error || res.statusText || 'Request failed');
          }
          statusEl.textContent = 'Success';
          await Promise.all([loadLogs(), loadPrs()]);
          return true;
        } catch (err) {
          statusEl.textContent = String(err.message || err);
          return false;
        }
      }

      async function loadLogs() {
        const list = document.getElementById('logs-list');
        try {
          const res = await fetch('/api/admin?action=logs', { credentials: 'same-origin' });
          if (!res.ok) throw new Error('Failed to load logs');
          const json = await res.json();
          const logs = Array.isArray(json.logs) ? json.logs : [];
          list.innerHTML = logs.length
            ? logs.map((entry) => `<li>${JSON.stringify(entry)}</li>`).join('')
            : '<li class="muted">No audit entries yet.</li>';
        } catch (err) {
          list.innerHTML = `<li class="muted">${String(err.message || err)}</li>`;
        }
      }

      async function loadPrs() {
        const list = document.getElementById('prs-list');
        try {
          const res = await fetch('/api/admin?action=list-prs', { credentials: 'same-origin' });
          if (!res.ok) throw new Error('Failed to load PR list');
          const json = await res.json();
          const prs = Array.isArray(json.prs) ? json.prs : [];
          list.innerHTML = prs.length
            ? prs.map((pr) => `<li><strong>${pr.title}</strong> — <a href="${pr.pr_url}" target="_blank">#${pr.pr_number}</a> by ${pr.author_email}</li>`).join('')
            : '<li class="muted">No PRs found.</li>';
        } catch (err) {
          list.innerHTML = `<li class="muted">${String(err.message || err)}</li>`;
        }
      }

      document.getElementById('assign-role-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const data = Object.fromEntries(new FormData(form).entries());
        await callAdmin('assign-role', { email: data.email, role: data.role }, document.getElementById('assign-role-status'));
        form.reset();
      });

      document.getElementById('revoke-role-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const email = new FormData(form).get('email');
        await callAdmin('revoke-role', { email }, document.getElementById('revoke-role-status'));
        form.reset();
      });

      document.getElementById('ban-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const data = Object.fromEntries(new FormData(form).entries());
        await callAdmin('ban', { email: data.email, until: data.until || null }, document.getElementById('ban-status'));
        form.reset();
      });

      document.getElementById('unban-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const email = new FormData(form).get('email');
        await callAdmin('unban', { email }, document.getElementById('unban-status'));
        form.reset();
      });

      loadLogs();
      loadPrs();
    </script>
  </body>
</html>
