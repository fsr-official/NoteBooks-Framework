name: Refresh files.json and notify NoteBooks

on:
  push:
    paths-ignore:
      - files.json
  workflow_call:

permissions:
  contents: write

concurrency:
  group: fmupdate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate files.json with file blob SHAs
        run: |
          set -euo pipefail
          test -f fmtree.py
          python3 fmtree.py --root . --out files.json
          test -s files.json
          python3 - <<'PY'
          import json
          import re

          with open("files.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          if not isinstance(manifest, dict):
              raise SystemExit("files.json must contain a JSON object")

          def verify(node):
              if not isinstance(node, dict):
                  return
              if node.get("type") == "file" and not re.fullmatch(r"[a-fA-F0-9]{40}", str(node.get("sha", ""))):
                  raise SystemExit(f"file entry lacks a Git blob SHA: {node.get('path') or node.get('name')}")
              for child in node.get("children", []):
                  verify(child)

          verify(manifest)
          print("files.json and file blob SHAs are valid")
          PY

      - name: Commit changed manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files.json
          if git diff --cached --quiet -- files.json; then
            echo "files.json is already current."
          else
            git commit -m "chore: refresh files.json [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  notify-website:
    needs: update-manifest
    uses: ./.github/workflows/fmwebhook.yaml
    with:
      repository: ${{ github.repository }}
      branch: ${{ github.ref_name }}
    secrets: inherit
