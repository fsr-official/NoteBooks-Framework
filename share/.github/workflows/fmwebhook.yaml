name: Notify NoteBooks repository update

on:
  workflow_call:
    inputs:
      repository:
        description: GitHub owner/repository identifier
        required: true
        type: string
      branch:
        description: Updated repository branch
        required: true
        type: string
      run_id:
        description: GitHub workflow run ID from the triggering push workflow
        required: true
        type: string
      run_attempt:
        description: GitHub workflow run attempt from the triggering push workflow
        required: true
        type: number
    secrets:
      WEBSITE_URL:
        description: Full NoteBooks repository-update webhook URL
        required: true
      WEBHOOK_SECRET:
        description: Shared HMAC secret configured on the NoteBooks website
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send signed repository update request
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ inputs.repository }}
          BRANCH: ${{ inputs.branch }}
          WORKFLOW_RUN_ID: ${{ inputs.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ inputs.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$WEBSITE_URL"
          test -n "$WEBHOOK_SECRET"
          request_body="$(node -e 'process.stdout.write(JSON.stringify({repository: process.env.REPOSITORY, branch: process.env.BRANCH, identity: {source: "push", runId: process.env.WORKFLOW_RUN_ID, runAttempt: Number(process.env.WORKFLOW_RUN_ATTEMPT)}}))')"
          signature="$(printf '%s' "$request_body" | node -e '
            const crypto = require("node:crypto");
            let body = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => body += chunk);
            process.stdin.on("end", () => {
              const digest = crypto.createHmac("sha256", process.env.WEBHOOK_SECRET).update(body, "utf8").digest("hex");
              process.stdout.write(`sha256=${digest}`);
            });
          ')"
          curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 \
            --request POST "$WEBSITE_URL" \
            --header "Content-Type: application/json" \
            --header "X-NoteBooks-Signature: $signature" \
            --data-binary "$request_body"
